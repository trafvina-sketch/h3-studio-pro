<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khởi động H3 Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070b14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }
    .splash-box {
      text-align: center;
      max-width: 420px;
      padding: 30px;
    }
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
      margin: 0 auto;
    }
    .pulse-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border: 2px solid #38bdf8;
      border-radius: 24px;
      animation: pulse 2s infinite ease-out;
      opacity: 0;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    h1 span {
      color: #38bdf8;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .bar-track {
      width: 100%;
      height: 6px;
      background: #141f36;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      border: 1px solid #1e2f52;
    }
    .bar-fill {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #2563eb, #38bdf8, #10b981);
      border-radius: 3px;
      animation: shimmer 1.6s infinite ease-in-out;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    .status-msg {
      margin-top: 14px;
      font-size: 12px;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="splash-box">
    <div class="logo-container">
      <div class="pulse-ring"></div>
      <div class="logo-badge">H3</div>
    </div>
    <h1>H3 <span>Studio</span> Desktop</h1>
    <p>Hệ thống AI Video Ref2VA &middot; Google Colab A100 GPU</p>
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
    <div class="status-msg" id="st">Đang khởi động dịch vụ và kiểm tra kết nối...</div>
  </div>
</body>
</html>
