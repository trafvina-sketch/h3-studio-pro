<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khởi động H3 Studio Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0c0e;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }
    .splash-box {
      text-align: center;
      max-width: 440px;
      padding: 32px;
      background: #141417;
      border: 1px solid rgba(201, 173, 125, 0.28);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #f4f4f5;
      margin-bottom: 6px;
    }
    h1 span {
      color: #e5d1b0;
    }
    p {
      font-size: 12.5px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .bar-track {
      width: 100%;
      height: 6px;
      background: #1c1c21;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(201, 173, 125, 0.25);
    }
    .bar-fill {
      height: 100%;
      width: 38%;
      background: linear-gradient(90deg, #b89863, #e5d1b0, #c9ad7d);
      border-radius: 999px;
      animation: shimmer 1.5s infinite ease-in-out;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
    .status-msg {
      margin-top: 14px;
      font-size: 11.5px;
      color: #c9ad7d;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="splash-box">
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="76" height="76" fill="none">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1d1b27"/>
            <stop offset="50%" stop-color="#111118"/>
            <stop offset="100%" stop-color="#09090d"/>
          </linearGradient>
          <linearGradient id="goldGrad" x1="60" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFF2D6"/>
            <stop offset="35%" stop-color="#E5C896"/>
            <stop offset="70%" stop-color="#C9AD7D"/>
            <stop offset="100%" stop-color="#8E6D3B"/>
          </linearGradient>
          <radialGradient id="amberGlow" cx="50%" cy="45%" r="50%">
            <stop offset="0%" stop-color="#C9AD7D" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#C9AD7D" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
        <circle cx="256" cy="230" r="210" fill="url(#amberGlow)"/>
        <rect x="34" y="34" width="444" height="444" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="10" opacity="0.92"/>
        <rect x="74" y="74" width="364" height="364" rx="68" fill="#13131c" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="18 10" opacity="0.78"/>
        <g stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.88">
          <line x1="176" y1="12" x2="176" y2="34"/><line x1="256" y1="12" x2="256" y2="34"/><line x1="336" y1="12" x2="336" y2="34"/>
          <line x1="176" y1="478" x2="176" y2="500"/><line x1="256" y1="478" x2="256" y2="500"/><line x1="336" y1="478" x2="336" y2="500"/>
          <line x1="12" y1="176" x2="34" y2="176"/><line x1="12" y1="256" x2="34" y2="256"/><line x1="12" y1="336" x2="34" y2="336"/>
          <line x1="478" y1="176" x2="500" y2="176"/><line x1="478" y1="256" x2="500" y2="256"/><line x1="478" y1="336" x2="500" y2="336"/>
        </g>
        <circle cx="256" cy="222" r="102" fill="#181722" stroke="url(#goldGrad)" stroke-width="7"/>
        <path d="M224 166 L316 222 L224 278 Z" fill="url(#goldGrad)"/>
        <path d="M352 114 L360 136 L382 144 L360 152 L352 174 L344 152 L322 144 L344 136 Z" fill="#FFF2D6"/>
        <text x="256" y="388" text-anchor="middle" fill="url(#goldGrad)" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="900" font-size="54" letter-spacing="2">H3 PRO</text>
        <text x="256" y="422" text-anchor="middle" fill="#b4b8c8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" font-size="19" letter-spacing="4">AI VIDEO STUDIO</text>
      </svg>
    </div>
    <h1>H3 STUDIO <span>PRO</span></h1>
    <p>Tạo Video AI Không Giới Hạn &middot; Cụm GPU Cloud A100 80GB</p>
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
    <div class="status-msg" id="st">Đang khởi động dịch vụ H3 Studio Pro...</div>
  </div>
</body>
</html>
