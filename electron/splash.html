<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khởi động H3 Studio Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0c0e;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      overflow: hidden;
    }
    .splash-box {
      text-align: center;
      max-width: 440px;
      padding: 32px;
      background: #141417;
      border: 1px solid rgba(201, 173, 125, 0.28);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #f4f4f5;
      margin-bottom: 6px;
    }
    h1 span {
      color: #e5d1b0;
    }
    p {
      font-size: 12.5px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .bar-track {
      width: 100%;
      height: 6px;
      background: #1c1c21;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(201, 173, 125, 0.25);
    }
    .bar-fill {
      height: 100%;
      width: 38%;
      background: linear-gradient(90deg, #b89863, #e5d1b0, #c9ad7d);
      border-radius: 999px;
      animation: shimmer 1.5s infinite ease-in-out;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
    .status-msg {
      margin-top: 14px;
      font-size: 11.5px;
      color: #c9ad7d;
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="splash-box">
    <div class="logo-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
        <defs>
          <linearGradient id="gcpuGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e5d1b0"/>
            <stop offset="50%" stop-color="#c9ad7d"/>
            <stop offset="100%" stop-color="#9e7f4f"/>
          </linearGradient>
        </defs>
        <g stroke="url(#gcpuGoldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none">
          <rect x="20" y="20" width="60" height="60" rx="10" fill="#141418"/>
          <rect x="31" y="31" width="38" height="38" rx="5"/>
          <line x1="35" y1="8" x2="35" y2="20"/><line x1="50" y1="8" x2="50" y2="20"/><line x1="65" y1="8" x2="65" y2="20"/>
          <line x1="35" y1="80" x2="35" y2="92"/><line x1="50" y1="80" x2="50" y2="92"/><line x1="65" y1="80" x2="65" y2="92"/>
          <line x1="8" y1="35" x2="20" y2="35"/><line x1="8" y1="50" x2="20" y2="50"/><line x1="8" y1="65" x2="20" y2="65"/>
          <line x1="80" y1="35" x2="92" y2="35"/><line x1="80" y1="50" x2="92" y2="50"/><line x1="80" y1="65" x2="92" y2="65"/>
        </g>
        <polygon points="44,40 44,60 60,50" fill="url(#gcpuGoldGrad)"/>
      </svg>
    </div>
    <h1>H3 STUDIO <span>PRO</span></h1>
    <p>Tạo Video AI Không Giới Hạn &middot; Cụm GPU Cloud A100 80GB</p>
    <div class="bar-track">
      <div class="bar-fill"></div>
    </div>
    <div class="status-msg" id="st">Đang khởi động dịch vụ H3 Studio Pro...</div>
  </div>
</body>
</html>
